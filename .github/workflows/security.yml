name: Security CI

# Runs on every push and pull request. The pipeline has two gates:
#   1. build  — the Java backend must compile.
#   2. scan   — the OWASP A04/A07 static analyzer must find no HIGH/CRITICAL issue.
# If either gate fails, the commit is marked with a red ✗ on GitHub.

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write   # needed to upload the SARIF report to the Security tab

jobs:
  build-backend:
    name: Build Java backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile backend
        run: |
          mkdir -p backend/out
          javac -d backend/out $(find backend/src -name '*.java')

  security-scan:
    name: OWASP A04/A07 scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the security scanner
        working-directory: tools/security-scanner
        run: |
          npm install
          npm run build

      - name: Run OWASP security scan
        run: |
          node tools/security-scanner/dist/cli.js backend/src \
            --sarif security-results.sarif \
            --min-severity low \
            --fail-on high

      - name: Upload SARIF to GitHub code scanning
        if: always()   # upload even when the scan fails, so findings show up in the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-results.sarif

      - name: Upload SARIF as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: security-results.sarif
